name: web
# Local workflow definition only; GitHub Actions remain disabled until reviewed.
# Validate the English frontend, catalog contracts, and static application text.
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "scripts/check-web-cjk.py"
      - "scripts/test_check_web_cjk.py"
      - "scripts/check-localization-boundaries.py"
      - "scripts/localization-boundaries.json"
      - "scripts/check-english-source.py"
      - "scripts/localization_source.py"
      - "scripts/localization_ast.go"
      - "scripts/english-source-exceptions.json"
      - "scripts/test_localization_boundaries.py"
      - "server/legacy_*_defaults.json"
      - "**/*.go"
      - "skills/**"
      - "LICENSE"
      - "db/schema.sql"
      - "agent/constraints.go"
      - "guard/guard.go"
      - "intercept/prompt.go"
      - "agent/promptcatalog.go"
      - "agent/worker.go"
      - "agent/planner.go"
      - "agent/mainagent.go"
      - "agent/goals.go"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/check-web-cjk.py"
      - "scripts/test_check_web_cjk.py"
      - "scripts/check-localization-boundaries.py"
      - "scripts/localization-boundaries.json"
      - "scripts/check-english-source.py"
      - "scripts/localization_source.py"
      - "scripts/localization_ast.go"
      - "scripts/english-source-exceptions.json"
      - "scripts/test_localization_boundaries.py"
      - "server/legacy_*_defaults.json"
      - "**/*.go"
      - "skills/**"
      - "LICENSE"
      - "db/schema.sql"
      - "agent/constraints.go"
      - "guard/guard.go"
      - "intercept/prompt.go"
      - "agent/promptcatalog.go"
      - "agent/worker.go"
      - "agent/planner.go"
      - "agent/mainagent.go"
      - "agent/goals.go"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_LOCALE: en
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend regression tests
        run: npm test
      - name: English catalog and placeholder checks
        run: npm run check:i18n
      - name: Rendered-text checker regression tests
        run: python3 -I -m unittest discover -s ../scripts -p 'test_check_web_cjk.py' -v
      - name: Verify protected source and behavioral boundaries
        run: python3 -I ../scripts/check-localization-boundaries.py
      - name: Static English build (includes type checking)
        run: npm run build:static
      - name: Check English HTML text and accessibility labels
        # Excludes scripts and explicit raw-content regions, not interface labels.
        # Runtime content still needs browser review; catalog checks run above.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: Lint, formatting, and accessibility checks
        if: always()
        run: npm run check
