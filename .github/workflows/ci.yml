name: ci
# Local definition only; remote workflows remain disabled until owner approval.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Synthetic fixture/runner tests use mocks only; the source parser needs Go.
  localization-eval-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Synthetic evaluation fixtures and runner regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*localization*.py'

  # Build and test without a database; database paths run in the matrix below.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Check application-owned English source
        run: python3 -I scripts/check-english-source.py
      - name: Check reviewed localization and provenance boundaries
        run: python3 -I scripts/check-localization-boundaries.py
      - name: Source checker regression tests
        run: python3 -I -m unittest discover -s scripts -p 'test_localization_boundaries.py' -v
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (no database; integration tests skip)
        run: go test ./... -count=1

  # Each package gets a fresh PostgreSQL service to avoid shared-test state.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test (isolated database package ${{ matrix.pkg }})
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
